version: 2
updates:
  # Workflow actions are pinned to commit SHAs; this keeps the pins current.
  # One grouped PR per month keeps CI runs (and review noise) to a minimum.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # The Dockerfile pins its base images by digest; this moves the pins.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      images:
        patterns: ['*']
