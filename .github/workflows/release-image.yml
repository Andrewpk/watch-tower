name: Release image

# Publishing a GitHub release builds the production image and pushes it to
# ghcr.io/<owner>/<repo>. Run it by hand (Actions > Release image > Run
# workflow) to check that the image still builds; manual runs never push.
#
# Release tags must be semver, e.g. v1.2.3. They produce the tags 1.2.3, 1.2 and
# latest. A pre-release such as v1.0.0-rc.1 only gets its exact version tag.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Registry paths must be lowercase, but the owner is Andrewpk.
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # latest=auto adds "latest" for stable semver tags only. Pre-releases
          # only extend {{version}}, so v1.0.0-rc.1 becomes 1.0.0-rc.1.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Skip the provenance attestation. It adds an extra "unknown/unknown"
          # entry to the GHCR package and slows the build down.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
