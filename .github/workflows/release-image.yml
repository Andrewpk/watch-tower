name: Release image

# Publishing a GitHub release builds the production image and pushes it to
# ghcr.io/<owner>/<repo>. PRs that touch the image files, and manual runs
# (Actions > Release image > Run workflow), only check that it builds.
#
# Release tags must be semver, e.g. v1.2.3. They produce the tags 1.2.3, 1.2 and
# latest. A pre-release such as v1.0.0-rc.1 produces 1.0.0-rc.1 and latest.
# Every published release moves latest, including pre-releases and releases of
# an older version.

on:
  release:
    types: [published]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/release-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Registry paths must be lowercase, but the owner is Andrewpk.
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # latest=true adds "latest" to every release, pre-releases included.
          # Pre-releases skip {{major}}.{{minor}}, so v1.0.0-rc.1 becomes
          # 1.0.0-rc.1 and latest. PR and manual runs have no semver tag, so
          # they get no tags at all.
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Skip the provenance attestation. It adds an extra "unknown/unknown"
          # entry to the GHCR package and slows the build down.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
